broker.listen_host = 0.0.0.0
broker.control_port = 7000
broker.public_port_start = 20000
broker.public_port_end = 40000
broker.tls_cert = /etc/tunnelmate/certs/broker.crt
broker.tls_key = /etc/tunnelmate/certs/broker.key
broker.hmac_key_file = /var/lib/tunnelmate/hmac.key
broker.broker_socket = /run/tunnelmate/broker.sock
broker.log_level = info
broker.max_tunnels = 256
broker.max_streams = 2048
broker.max_streams_per_tunnel = 128
broker.max_pending_streams = 128
broker.handshake_timeout_ms = 15000
broker.idle_timeout_ms = 90000
broker.heartbeat_interval_ms = 15000
broker.bind_timeout_ms = 10000
broker.shutdown_grace_ms = 5000
broker.connect_rate_per_ip = 30
broker.udp_max_datagram_size = 1400
broker.udp_max_flows = 32768
broker.udp_max_flows_per_tunnel = 2048
broker.udp_flow_idle_timeout_ms = 30000
broker.udp_max_packets_per_tunnel = 2000
broker.udp_max_packets_per_source = 200
broker.udp_flow_creation_rate = 50
broker.udp_queue_packets = 256
